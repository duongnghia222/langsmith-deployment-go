syntax = "proto3";

package engineCommon;

option go_package = "github.com/duongnghia222/langsmith-deployment-go/gen/engine_common;engine_common";

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";
import "errors/errors.proto";
import "enum_durability/enum_durability.proto";
import "enum_stream_mode/enum_stream_mode.proto";

message ChannelValue {
  oneof val {
    engineCommon.SerializedValue serialized_value = 2;
    engineCommon.Sends sends = 3;
    google.protobuf.Empty missing = 4;
  }
}

message SerializedValue {
  string encoding = 1;
  bytes value = 2;
}

message ResponseChunk {
  repeated string namespaces = 1;
  string mode = 2;
  engineCommon.SerializedValue payload = 3;
}

message ResponseChunkList {
  repeated engineCommon.ResponseChunk responses = 1;
}

message MessageIds {
  repeated string message_ids = 1;
}

message Channels {
  map<string, engineCommon.Channel> channels = 1;
}

message Channel {
  engineCommon.ChannelValue get_result = 1;
  bool is_available_result = 2;
  engineCommon.ChannelValue checkpoint_result = 3;
}

message Sends {
  repeated engineCommon.Send sends = 1;
}

message Send {
  string node = 1;
  engineCommon.SerializedValue arg = 2;
}

message Command {
  optional string graph = 1;
  map<string, engineCommon.SerializedValue> update = 2;
  engineCommon.Resume resume = 3;
  repeated engineCommon.Goto gotos = 4;
}

message Resume {
  oneof message {
    engineCommon.SerializedValue value = 1;
    engineCommon.InterruptValues values = 2;
  }
}

message InterruptValues {
  map<string, engineCommon.SerializedValue> values = 1;
}

message Goto {
  oneof message {
    string node_name = 1;
    engineCommon.Send send = 2;
  }
}

message GraphBubbleUp {
}

message ParentCommand {
  engineCommon.Command command = 1;
}

message GraphInterrupt {
  repeated engineCommon.Interrupt interrupts = 1;
}

message Interrupt {
  engineCommon.SerializedValue value = 1;
  string id = 2;
}

message WrappedInterrupts {
  repeated engineCommon.Interrupt interrupts = 1;
  engineCommon.SerializedValue serialized_interrupts = 2;
}

message Write {
  string channel = 1;
  engineCommon.ChannelValue value = 2;
}

message PendingWrite {
  string task_id = 1;
  string channel = 2;
  engineCommon.ChannelValue value = 3;
}

message ChannelVersions {
  map<string, string> channel_versions = 1;
}

message EngineRunnableConfig {
  repeated string tags = 1;
  map<string, bytes> metadata_json = 2;
  optional string run_name = 3;
  optional int32 max_concurrency = 4;
  optional int32 recursion_limit = 5;
  optional string run_id = 6;
  map<string, bytes> extra_configurable_json = 7;
  map<string, bytes> extra_json = 8;
  optional engineCommon.Runtime runtime = 9;
  optional bool resuming = 10;
  optional string task_id = 11;
  optional string thread_id = 12;
  map<string, string> checkpoint_map = 13;
  optional string checkpoint_id = 14;
  optional string checkpoint_ns = 15;
  optional enumDurability.Durability durability = 16;
  map<string, engineCommon.SerializedValue> resume_map = 17;
  optional string graph_id = 18;
  repeated enumStreamMode.StreamMode root_stream_modes = 19;
  optional int32 run_attempt = 20;
  optional string server_run_id = 21;
  optional string tracing_project = 22;
  optional string tracing_example_id = 23;
}

message Runtime {
  optional bytes langgraph_context_json = 1;
  optional engineCommon.ChannelValue previous = 2;
}

message Subgraph {
  string graph_id = 1;
}

message Task {
  string name = 1;
  repeated engineCommon.Write writes = 3;
  engineCommon.EngineRunnableConfig config = 4;
  repeated string triggers = 5;
  string id = 6;
  repeated engineCommon.PathSegment task_path = 7;
  repeated engineCommon.PendingWrite pending_writes = 10;
  bool stream_subgraphs = 12;
  optional engineCommon.Subgraph subgraph = 13;
}

message TaskResult {
  oneof message {
    errors.UserCodeExecutionError user_error = 1;
    engineCommon.WrappedInterrupts interrupts = 2;
    engineCommon.ParentCommand parent_command = 3;
    errors.GraphRecursionLimitError recursion_limit_error = 5;
  }
  repeated engineCommon.Write writes = 4;
}

message CheckpointRef {
  string checkpoint_id = 1;
  string thread_id = 2;
  string checkpoint_ns = 3;
  map<string, string> checkpoint_map = 4;
}

message PregelTaskSnapshot {
  string id = 1;
  string name = 2;
  repeated engineCommon.PathSegment path = 3;
  repeated engineCommon.Interrupt interrupts = 4;
  oneof state {
    engineCommon.CheckpointRef checkpoint_ref = 5;
    engineCommon.StateSnapshot state_snapshot = 8;
  }
  bytes result_json = 6;
  engineCommon.SerializedValue error = 7;
}

message Checkpoint {
  uint64 v = 1;
  string id = 2;
  map<string, engineCommon.ChannelValue> channel_values = 3;
  map<string, string> channel_versions = 4;
  map<string, engineCommon.ChannelVersions> versions_seen = 5;
  string ts = 6;
  repeated string updated_channels = 7;
}

message CheckpointMetadata {
  enum CheckpointSource {
    unknown = 0;
    loop = 1;
    input = 2;
    update = 3;
    fork = 4;
  }
  engineCommon.CheckpointMetadata.CheckpointSource source = 1;
  int32 step = 2;
  map<string, string> parents = 3;
  optional string run_id = 4;
  map<string, bytes> extras = 5;
}

message CheckpointTuple {
  engineCommon.EngineRunnableConfig config = 1;
  engineCommon.Checkpoint checkpoint = 2;
  engineCommon.CheckpointMetadata metadata = 3;
  engineCommon.EngineRunnableConfig parent_config = 4;
  repeated engineCommon.PendingWrite pending_writes = 5;
}

message Updates {
  engineCommon.Checkpoint checkpoint = 1;
  engineCommon.Channels channels = 2;
  repeated string updated_channels = 3;
}

message ToolCall {
  string name = 1;
  bytes args_json = 2;
  google.protobuf.StringValue id = 3;
}

message ToolCallChunk {
  google.protobuf.StringValue name = 1;
  google.protobuf.StringValue args_json = 2;
  google.protobuf.StringValue id = 3;
  google.protobuf.Int32Value index = 4;
}

message InvalidToolCall {
  google.protobuf.StringValue name = 1;
  google.protobuf.StringValue args = 2;
  google.protobuf.StringValue id = 3;
  google.protobuf.StringValue error = 4;
}

message InputTokenDetails {
  google.protobuf.Int64Value audio = 1;
  google.protobuf.Int64Value cache_creation = 2;
  google.protobuf.Int64Value cache_read = 3;
}

message OutputTokenDetails {
  google.protobuf.Int64Value audio = 1;
  google.protobuf.Int64Value reasoning = 2;
}

message UsageMetadata {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 total_tokens = 3;
  engineCommon.InputTokenDetails input_token_details = 4;
  engineCommon.OutputTokenDetails output_token_details = 5;
}

message ResponseMetadata {
  map<string, bytes> data = 1;
}

message AIFields {
  optional engineCommon.UsageMetadata usage_metadata = 1;
  optional engineCommon.ResponseMetadata response_metadata = 2;
  repeated engineCommon.ToolCall tool_calls = 3;
  repeated engineCommon.ToolCallChunk tool_call_chunks = 4;
  repeated engineCommon.InvalidToolCall invalid_tool_calls = 5;
  optional string chunk_position = 6;
  google.protobuf.StringValue reasoning_content = 10;
}

message ToolFields {
  google.protobuf.StringValue tool_call_id = 1;
  string status = 2;
  optional engineCommon.SerializedValue artifact = 3;
}

message HumanFields {
}

message Content {
  oneof content {
    string text = 1;
    engineCommon.ContentBlocks blocks = 2;
  }
}

message ContentBlocks {
  repeated engineCommon.ContentBlock items = 1;
}

message ContentBlock {
  oneof data {
    string text = 1;
    engineCommon.StructuredBlock structured = 2;
  }
}

message StructuredBlock {
  optional int32 index = 1;
  optional string type = 2;
  bytes data_json = 3;
}

message ChatMessage {
  string id = 1;
  string name = 2;
  string type = 3;
  engineCommon.Content content = 4;
  map<string, bytes> additional_kwargs = 5;
  oneof details {
    engineCommon.AIFields ai = 6;
    engineCommon.ToolFields tool = 7;
    engineCommon.HumanFields human = 8;
  }
  map<string, bytes> extensions = 20;
}

message ChatMessageEnvelope {
  bool is_streaming_chunk = 1;
  repeated string namespace = 2;
  engineCommon.ChatMessage message = 3;
  optional bytes metadata = 4;
  optional string node_name = 5;
}

message StateSnapshot {
  bytes values_json = 1;
  repeated string next = 2;
  engineCommon.EngineRunnableConfig config = 3;
  optional engineCommon.CheckpointMetadata metadata = 4;
  optional string created_at = 5;
  optional engineCommon.EngineRunnableConfig parent_config = 6;
  repeated engineCommon.PregelTaskSnapshot tasks = 7;
  repeated engineCommon.Interrupt interrupts = 8;
}

message StateUpdate {
  engineCommon.SerializedValue values = 1;
  optional string as_node = 2;
  optional string task_id = 3;
}

message SuperstepUpdates {
  repeated engineCommon.StateUpdate updates = 1;
}

message StringOrSlice {
  repeated string values = 1;
  bool is_string = 2;
}

message PathSegment {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    bool bool_value = 3;
  }
}

message StaticInterruptConfig {
  message NodeNames {
    repeated string names = 1;
  }
  oneof config {
    bool all = 1;
    engineCommon.StaticInterruptConfig.NodeNames node_names = 2;
  }
}
